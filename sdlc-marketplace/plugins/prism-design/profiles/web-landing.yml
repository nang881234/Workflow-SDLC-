id: web-landing
name: Web landing page
primary_users: [khách truy cập mới, khách tiềm năng]
density: low
platforms:
  - mobile 390 primary
  - desktop 1440
  - tablet 768
research_focus:
  - thông điệp và cấu trúc thuyết phục, không phải chức năng
  - benchmark tốc độ tải và trọng lượng trang
  - pattern form thu thập lead ngắn nhất có thể
flow_rules:
  - flow chỉ gồm đường tới một conversion duy nhất
  - khai báo toàn bộ điểm tracking trước khi dựng wireframe
wireframe_rules:
  - mobile first, dựng mobile trước desktop
  - một trang một mục tiêu, một CTA chính lặp lại
  - khai báo thứ tự tải và nội dung above the fold
ui_rules:
  - được phép phá cách so với Design System ở phần hero, phần còn lại giữ token
  - motion và illustration là thành phần bắt buộc, không phải tuỳ chọn
  - ngân sách ảnh và font phải ghi rõ trong spec
usability_test:
  required_when: landing phục vụ chiến dịch có ngân sách media
  default_type: A/B test sau khi release thay cho usability test trước
handoff_extras:
  - asset export đủ mật độ, định dạng và kích thước tối đa
  - bảng tracking event và tham số
  - bản copy đa ngôn ngữ nếu có
a11y_target: WCAG 2.2 AA cho nội dung và form
done_criteria:
  - copy cuối đã duyệt, không còn lorem
  - ngân sách hiệu năng được Engineering xác nhận
